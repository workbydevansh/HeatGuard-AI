  <circle cx="64" cy="50" r="18" fill="url(#sun)" filter="url(#glow)"/>
  <path d="M36 78c9-6 17-6 26 0s17 6 30 0" fill="none" stroke="#67F3C2" stroke-width="6" stroke-linecap="round"/>
  <path d="M40 92c7-4.8 14-4.8 22 0s16 4.8 26 0" fill="none" stroke="#20D998" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 50h32M64 34v32" stroke="#020604" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
