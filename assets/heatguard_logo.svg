        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M64 8 106 24v32c0 29.6-17.2 51.4-42 64C39.2 107.4 22 85.6 22 56V24L64 8Z" fill="#020604"/>
