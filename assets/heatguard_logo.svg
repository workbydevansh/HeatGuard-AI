<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">HeatGuard AI logo</title>
  <desc id="desc">Shield with sun and heat wave lines</desc>
  <defs>
    <linearGradient id="shield" x1="24" y1="14" x2="104" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67F3C2"/>
      <stop offset="0.52" stop-color="#20D998"/>
      <stop offset="1" stop-color="#020604"/>
    </linearGradient>
    <linearGradient id="sun" x1="36" y1="28" x2="96" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.62" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
